<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="黄金四分钟 · 心肺复苏节拍训练游戏：跟着节拍器练习 100~120 次/分的标准按压节奏">
<title>黄金四分钟 · 心肺复苏节拍训练</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="640"></canvas>
  <div id="touchbar">
    <button class="tbtn" data-key="Enter">确认 Enter</button>
    <button class="tbtn" data-key="F">拍肩 F</button>
    <button class="tbtn" data-key="1">选项 1</button>
    <button class="tbtn" data-key="2">选项 2</button>
    <button class="tbtn" data-key="Space">按压 空格</button>
    <button class="tbtn" data-key="B">吹气 B（按住）</button>
    <button class="tbtn" data-key="R">重来 R</button>
  </div>
  <p class="foot">本游戏用于科普训练演示，不能替代正规急救培训 · 成人 CPR 参数（2025 AHA 指南）</p>
</div>
<script src="game.js?v=2"></script>
</body>
</html>
